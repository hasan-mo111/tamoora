version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: investment_db
    environment:
      POSTGRES_USER: investment_user
      POSTGRES_PASSWORD: investment_pass_2024
      POSTGRES_DB: investment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - investment_network

  redis:
    image: redis:7-alpine
    container_name: investment_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - investment_network

volumes:
  postgres_data:
  redis_data:

networks:
  investment_network:
    driver: bridge